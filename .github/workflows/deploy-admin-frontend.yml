name: Deploy Admin Frontend

on:
  push:
    branches: [main]
    paths:
      - 'gameadmin/web/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, doudou-prod, dou-ph-prod, dou-idr-prod]

jobs:
  deploy-staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: gameadmin/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: corepack enable && yarn install --immutable
      - run: yarn build
      - uses: ./.github/actions/ssh-setup
        with: { ssh-key: ${{ secrets.DEPLOY_SSH_KEY }} }
      - name: Sync dist to staging
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          eval $(ssh-agent -s)
          rsync -avz -P --delete -e "ssh $DEPLOY_SSH_OPTS" ./dist/ "root@${DEPLOY_HOST}:/data/game-admin/"

  deploy-manual:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment != 'staging'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: gameadmin/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: corepack enable && yarn install --immutable
      - run: yarn build
      - uses: ./.github/actions/ssh-setup
        with: { ssh-key: ${{ secrets.DEPLOY_SSH_KEY }} }
      - name: Sync dist
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          rsync -avz -P --delete -e "ssh $DEPLOY_SSH_OPTS" ./dist/ "root@${DEPLOY_HOST}:/data/game-admin/"
